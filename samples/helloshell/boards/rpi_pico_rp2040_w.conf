CONFIG_TEST_RANDOM_GENERATOR=y

# make sure there are enough resources for network and shell commands
# zephyr-keep-sorted-start
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_NET_MGMT_EVENT_STACK_SIZE=1024
CONFIG_SHELL_STACK_SIZE=5200
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_ZVFS_OPEN_ADD_SIZE_NET=10
CONFIG_ZVFS_POLL_MAX=10
# zephyr-keep-sorted-stop

# enable Infineon AIROC SoC Wi-Fi and related shell commands
# zephyr-keep-sorted-start
CONFIG_NETWORKING=y
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_L2_WIFI_SHELL=y
CONFIG_WIFI=y
CONFIG_WIFI_LOG_LEVEL_ERR=y
# zephyr-keep-sorted-stop

# enable network stack with TCP/IP and related shell commands
# zephyr-keep-sorted-start
CONFIG_NET_ARP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_LOG_LEVEL_INF=y
CONFIG_NET_DHCPV6=y
CONFIG_NET_DHCPV6_LOG_LEVEL_INF=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y
CONFIG_NET_LOG=y
CONFIG_NET_MAX_CONN=10
CONFIG_NET_MAX_CONTEXTS=10
CONFIG_NET_RX_STACK_SIZE=2048
CONFIG_NET_SHELL=y
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_PERIODIC_OUTPUT=n
CONFIG_NET_STATISTICS_USER_API=y
CONFIG_NET_STATISTICS_WIFI=y
CONFIG_NET_TCP=y
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_UDP=y
# zephyr-keep-sorted-stop

# enable network settings for applications
# zephyr-keep-sorted-start
CONFIG_NET_CONFIG_AUTO_INIT=y
CONFIG_NET_CONFIG_CLOCK_SNTP_INIT=y
CONFIG_NET_CONFIG_INIT_TIMEOUT=60
CONFIG_NET_CONFIG_MY_IPV4_ADDR=""
CONFIG_NET_CONFIG_MY_IPV6_ADDR=""
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_NEED_IPV6=n
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_SNTP_INIT_RESYNC=y
CONFIG_NET_CONFIG_SNTP_INIT_RESYNC_INTERVAL=600
CONFIG_NET_CONFIG_SNTP_INIT_RESYNC_ON_FAILURE_INTERVAL=60
CONFIG_NET_CONFIG_SNTP_INIT_SERVER="0.pool.ntp.org"
# zephyr-keep-sorted-stop

# enable basic network services
# zephyr-keep-sorted-start
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_RESOLVER_MAX_SERVERS=4
CONFIG_SNTP=y
# zephyr-keep-sorted-stop
