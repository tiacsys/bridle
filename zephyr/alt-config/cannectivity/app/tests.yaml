sample:
  description: CANnectivity USB-to-CAN adapter firmware
  name: cannectivity
common:
  tags:
    - cannectivity
    - can
    - usb
  harness: console
  harness_config:
    type: one_line
    regex:
      - "CANnectivity firmware initialized with .*"
tests:
  app.cannectivity.debug:
    tags:
      - bridle
    depends_on:
      - can
      - usbd
    integration_platforms:
      - canbardo
      - candlelightfd
      - candlelightfd/stm32g0b1xx/dual
      - frdm_k64f
      - frdm_mcxn947/mcxn947/cpu0
      - lpcxpresso55s16
      - nucleo_h723zg
      - usb2canfdv1
      - usb2canfdv2
    extra_args:
      - FILE_SUFFIX=debug
  app.cannectivity:
    tags:
      - bridle
    depends_on:
      - can
      - usbd
    integration_platforms:
      - waveshare_rp2350_can/rp2350a/hazard3
      - waveshare_rp2350_can/rp2350a/m33
    platform_allow:
      - canbardo
      - candlelight
      - candlelightfd
      - candlelightfd/stm32g0b1xx/dual
      - frdm_k64f
      - frdm_mcxn947/mcxn947/cpu0
      - lpcxpresso55s16
      - mks_canable_v20
      - nucleo_h723zg
      - ucan
      - usb2canfdv1
      - usb2canfdv2
      - waveshare_rp2350_can/rp2350a/hazard3
      - waveshare_rp2350_can/rp2350a/m33
    build_only: true
  app.cannectivity.sof:
    depends_on:
      - can
      - usbd
    integration_platforms:
      - lpcxpresso55s16
      - nucleo_h723zg
    extra_configs:
      - CONFIG_USB_DEVICE_GS_USB_TIMESTAMP_SOF=y
  app.cannectivity.dfu:
    sysbuild: true
    depends_on:
      - can
      - usbd
    platform_allow:
      - canbardo
      - frdm_k64f
      - frdm_mcxn947/mcxn947/cpu0
      - lpcxpresso55s16
