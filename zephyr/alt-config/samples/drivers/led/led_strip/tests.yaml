sample:
  description: Demonstration of the LED strip driver.
  name: LED strip sample
common:
  tags:
    - zephyr
    - shield
    - drivers
    - led
  filter: dt_alias_exists("led-strip")
  harness: console
  harness_config:
    fixture: fixture_led_strip
tests:
  #
  # boards with LED strip
  #
  sample.drivers.led_strip:
    integration_platforms:
      - coffeecaller_nrf52
      - cytron_maker_nano_rp2040
      - cytron_maker_pi_rp2040
      - cytron_motion_2350_pro/rp2350a/hazard3_0
      - cytron_motion_2350_pro/rp2350a/m33_0
      - mini_usb_rp2040@4mb/rp2040
      - mini_usb_rp2040@16mb/rp2040
      - mini_usb_rp2350@4mb/rp2350a/hazard3_0
      - mini_usb_rp2350@4mb/rp2350a/m33_0
      - mini_usb_rp2350@16mb/rp2350a/hazard3_0
      - mini_usb_rp2350@16mb/rp2350a/m33_0
      - picoboy_color_plus/rp2350a/hazard3_0
      - picoboy_color_plus/rp2350a/m33_0
      - waveshare_rp2040_eth
      - waveshare_rp2040_matrix
      - waveshare_rp2040_one
      - waveshare_rp2040_tiny
      - waveshare_rp2040_zero
      - waveshare_rp2350_matrix/rp2350a/hazard3_0
      - waveshare_rp2350_matrix/rp2350a/m33_0
  #
  # shield: GeeekPi Pico Breadboard Kit Plus (EP-0172)
  #
  sample.drivers.led_strip.geeekpi_pico_bb_plus:
    extra_args:
      SHIELD=geeekpi_pico_bb_plus
    integration_platforms:
      - rpi_pico/rp2040/bbe
      - rpi_pico/rp2040/w/bbe
      - rpi_pico2/rp2350a/hazard3_0/bbe
      - rpi_pico2/rp2350a/m33_0/bbe
      - rpi_pico2/rp2350a/m33_0/w/bbe
      - waveshare_rp2040_plus
      - waveshare_rp2040_plus@16mb
  #
  # shield: Seeed Studio XIAO (6x10 RGB) MATRIX
  #
  sample.drivers.led_strip.seeed_xiao_6x10_rgb_matrix:
    extra_args:
      SHIELD=seeed_xiao_6x10_rgb_matrix
    integration_platforms:
      - seeeduino_xiao/samd21g18a
      - seeeduino_xiao/samd21g18a/bbe
      - xiao_ble/nrf52840
      - xiao_ble/nrf52840/sense
      - xiao_esp32c3/esp32c3
      - xiao_esp32s3/esp32s3/procpu
      - xiao_esp32s3/esp32s3/procpu/sense
      - xiao_mg24/efr32mg24b220f1536im48
      - xiao_ra4m1/r7fa4m1ab3cne
      - xiao_rp2040/rp2040
      - xiao_rp2040/rp2040/bbe
      - xiao_rp2350/rp2350a/hazard3_0
      - xiao_rp2350/rp2350a/hazard3_0/bbe
      - xiao_rp2350/rp2350a/m33_0
      - xiao_rp2350/rp2350a/m33_0/bbe
      - xiao_samd21/samd21g18a
      - xiao_stm32c5/stm32c5a3xx
      - xiao_stm32c5/stm32c5a3xx/bbe
  #
  # shield: SeenGreat Pico RGB Matrix Panel Expansion S1
  #
  sample.drivers.led_strip.seengreat_pico_rgb_matrix_pes1:
    extra_args:
      SHIELD=seengreat_pico_rgb_matrix_pes1
    integration_platforms:
      - rpi_pico/rp2040/bbe
      - rpi_pico/rp2040/w/bbe
      - rpi_pico2/rp2350a/hazard3_0/bbe
      - rpi_pico2/rp2350a/m33_0/bbe
      - rpi_pico2/rp2350a/m33_0/w/bbe
      - waveshare_rp2040_plus
      - waveshare_rp2040_plus@16mb
  #
  # shield: Waveshare Pico RGB LED
  #
  sample.drivers.led_strip.waveshare_pico_rgb_led:
    extra_args:
      SHIELD=waveshare_pico_rgb_led
    integration_platforms:
      - rpi_pico/rp2040/bbe
      - rpi_pico/rp2040/w/bbe
      - rpi_pico2/rp2350a/hazard3_0/bbe
      - rpi_pico2/rp2350a/m33_0/bbe
      - rpi_pico2/rp2350a/m33_0/w/bbe
      - waveshare_rp2040_lcd_0_96
      - waveshare_rp2040_plus
      - waveshare_rp2040_plus@16mb
      - waveshare_rp2350_can/rp2350a/hazard3_0
      - waveshare_rp2350_can/rp2350a/m33_0
