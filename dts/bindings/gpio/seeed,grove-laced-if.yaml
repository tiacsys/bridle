description: |
    The Laced Grove Signal Interface.

    The Laced Grove Signal Interface provide an linear mapping of individuell
    signals dependent on a concrete Grove Interconnect Shield.

    Use GROVE_LIF_* constants in
    <zephyr/dt-bindings/gpio/grove-laced-if.h> to refer to specific
    pins using convenient constant names.

compatible: "seeed,grove-laced-if"

include: [pwm-nexus.yaml, gpio-nexus.yaml, base.yaml]
