description: |
    GPIO pins exposed on Raspberry Pi Pico (R3) headers.

    The Pico layout provides two headers, one each along opposite edges
    of the board.

    Proceeding counter-clockwise:
    * A 20-pin header.  16 pins on this header are exposed by this binding.
    * A 20-pin header.  10 pins on this header are exposed by this binding.

    This binding provides a nexus mapping for 26 pins where parent pins 23
    through 25 correspond to ADC0 through ADC2, and parent pins 0 through 22
    correspond as depicted below:

        0 GP0/UART0_TX                    VBUS -
        1 GP1/UART0_RX                    VSYS -
        - GND                              GND -
        2 GP2/UART0_CTS                 3V3_EN -
        3 GP3/UART0_RTS                3V3_OUT -
        4 GP4/I2C0_SDA                 ADC_REF -
        5 GP5/I2C0_SCL               ADC2/GP28 25
        - GND                         AGND/GND -
        6 GP6                        ADC1/GP27 24
        7 GP7                        ADC0/GP26 23
        8 GP8                              RUN -
        9 GP9/SPI1_CSn                    GP22 22
        - GND                              GND -
       10 GP10/SPI1_SCK                   GP21 21
       11 GP11/SPI1_TX                    GP20 20
       12 GP12/SPI1_RX            SPI0_TX/GP19 19
       13 GP13                   SPI0_SCK/GP18 18
        - GND                              GND -
       14 GP14/I2C1_SDA          SPI0_CSn/GP17 17
       15 GP15/I2C1_SCL           SPI0_RX/GP16 16

    Use RPIPICO_HEADER_R3_* constants in
    <zephyr/dt-bindings/gpio/raspberrypi-pico-header-r3.h> to refer to specific
    pins using convenient constant names.

compatible: "raspberrypi,pico-header-r3"

include: [gpio-nexus.yaml, base.yaml]
