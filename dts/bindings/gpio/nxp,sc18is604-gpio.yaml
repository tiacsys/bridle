description: GPIO controller part of an SC18IS604 bridge

compatible: "nxp,sc18is604-gpio"

include: [gpio-controller.yaml]

properties:
  "#gpio-cells":
    const: 2

  ngpios:
    required: true
    const: 5

gpio-cells:
  - pin
  - flags

on-bus: nxp,sc18is604
