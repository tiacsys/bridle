name: Pull Request Labeler

on:
  pull_request_target:

jobs:
  triage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/labeler@v7
        with:
          repo-token: '${{ secrets.GITHUB_TOKEN }}'
