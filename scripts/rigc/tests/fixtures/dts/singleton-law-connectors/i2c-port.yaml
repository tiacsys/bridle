#
# This copy adds exactly the one missing property (`socket,i2c`) the
# production type's own docstring already implies every i2c-port socket
# needs a bus to reach; every other line is byte-identical to the real
# binding -- that part of the original claim still holds. Threaded via
# --bindings-dir alongside fixture copies of the other three real types
# in this same directory (arduino-r3.yaml, mikrobus.yaml, grove.yaml) so
# this test's board reading never touches the production
# dts/bindings/connectors/ directory at all -- editing it would be
# changing shared registry content for every other consumer, not this
# slice's fixture. The --connector-dir (rigc's OWN plug-matching/position
# registry, used by shield-side parsing) is left at its REAL default
