# CORRECTION (2026-08-30): this directory's four files were originally
# ALL "copied verbatim" apart from this one deliberate patch -- that is
# no longer true for two of the three siblings, and this comment (not the
# YAML content below, which stays as authored) is what states the actual
# current state:
