# The shared arduino_r3 alias (a conventional socket label both real
# boards' own devicetree carries, see reference/board-socket.rst)
# rather than a board-prefixed socket label, so this resolves regardless
# of which real board -DBOARD names -- see rig.yml.
instances:
  - name: logger
    shield: adafruit_data_logger
    socket: arduino_r3
