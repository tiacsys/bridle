# Synthetic fixture: an instance naming a socket the board simply does
# not have -- it passes through SocketBinding's own lookup-else-identity
# (an empty binding: rig.yml has no sockets: map to populate it, so
# every socket name passes through unchanged -- the instance's own
# socket name is looked up on the board as written, which is exactly
# what this proves) and fails at the board-side phys-socket check
# instead. board is INJECTED by the test (unmapped_socket_board, matching
# this fixture's own unmapped_socket_board.dts passed via --board-dts),
# not declared here -- the real board is incidental to what the test
# proves, so this rig.yml carries none.
rig:
  name: unmapped-socket
