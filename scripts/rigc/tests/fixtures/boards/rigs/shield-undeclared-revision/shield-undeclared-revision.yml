# Synthetic fixture: shield: <name>@<rev> naming a revision
# shield.yml does not declare. i2c_sensor declares revisions "1"/"2" only
# (the shield-revision pilot fixture); "99" is not
# among them. Fails inside the loader itself (shield resolution), so no
# board recipe is ever needed -- the board string is a placeholder.
instances:
  - name: sensor_0
    shield: i2c_sensor@99
    socket: nucleo_ard
