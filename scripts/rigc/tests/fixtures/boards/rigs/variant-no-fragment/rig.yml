# Synthetic fixture: a declared variant whose constructed fragment files
# (neither .overlay nor _defconfig) exist at all -- rule 10, naming the
# files that were looked for. "ghost" is the declared default, so a bare
# invocation already selects it and triggers the check.
rig:
  name: variant-no-fragment
  variants:
    default: base_only
    list: [base_only, ghost]
