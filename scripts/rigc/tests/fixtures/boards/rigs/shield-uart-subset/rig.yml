# Synthetic fixture: a shield needing socket,uart, mated through the
# conventional arduino_r3 alias both real boards' own devicetree already
# carries -- nucleo_f401re's Arduino socket deliberately
# exposes no socket,uart while frdm_k64f's exposes uart3 (both real board
# sockets), so the SAME content is realizable on frdm and loudly rejected
# on nucleo. Proves the subset-exposure check runs against the board's
# own typed socket regardless of which host it is.
#
# One variant-less rig, built on two DIFFERENT injected boards (each
# supplied at invocation): rig.yml carries no board: and no sockets:
# map, and the content names the conventional arduino_r3 label directly,
# so the same rig.yml builds against either board unchanged. No
# variants: axis is needed -- the board is not a property of the rig,
# so there is nothing board-specific left for a variant to select.
#
rig:
  name: shield-uart-subset
