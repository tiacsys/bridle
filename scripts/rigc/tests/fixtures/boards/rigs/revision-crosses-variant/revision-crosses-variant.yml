# Synthetic fixture: a family-wide revision whose params names
# a device the POST-VARIANT topology does not have. variant 'hpm'
# substitutes sensor_1's shield (restate_fixture -> pilot_alt_button,
# device label rf_sensor -> pab_key); revision '2' (family-wide, so it
# applies regardless of which variant ran) still tries to set params for
# 'rf_sensor', which pilot_alt_button does not have. Unavoidable by
# construction: one fragment cannot serve both variants'
# device-label vocabularies.
instances:
  - name: sensor_1
    shield: restate_fixture
    socket: nucleo_ard
    params:
      rf_sensor:
        vnd,threshold: 20
