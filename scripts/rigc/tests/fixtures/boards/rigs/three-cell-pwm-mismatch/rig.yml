# 3-cell PWM fixture rig (CHILD/PARENT MISMATCH case,
# test_three_cell_pwm.py: child and parent cell counts differ): the
# board itself (three_cell_pwm_mismatch_board.dts) carries the bad
# socket -- board/project.py's project_edt walks every socket,* node
