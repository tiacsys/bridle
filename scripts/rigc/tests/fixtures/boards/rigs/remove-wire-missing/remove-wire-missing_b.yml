# remove-wires: names x.dl_sq -> y.dl_led2, which does not exist (the
# real wire is x.dl_sq -> y.dl_led1 -- dl_led2 is a real label, just the
# wrong endpoint; find_wire matches the raw pair literally, never through
# Shield.by_name, so this is a genuine miss, not a stale spelling).
remove-wires:
  - from: x.dl_sq
    to: y.dl_led2
