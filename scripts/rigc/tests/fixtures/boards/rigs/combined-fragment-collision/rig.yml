# Synthetic fixture: rule 4 WIDENED for combined fragments (design-log
# 2026-07-26d). variant_a_2's own single-axis stem
# (combined-fragment-collision_variant_a_2) is IDENTICAL to the combined
# stem variant_a + revision 2 would construct
# (combined-fragment-collision_variant_a_2) -- two distinct selections,
# one filename. Neither axis value equals the other outright, so the
# original (narrower) rule 4 would have missed this.
rig:
  name: combined-fragment-collision
  revision:
    format: number
    default: "1"
