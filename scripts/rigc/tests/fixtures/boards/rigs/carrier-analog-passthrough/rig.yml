# Carrier PWM/ADC pass-through fixture rig (ACCEPT case,
# test_carrier_analog_passthrough.py): a single-plug fixture
# carrier re-exports one socket (ca_out) carrying gpio+pwm+adc rows;
# a PWM consumer and an ADC consumer both mate it, proving that both
# functions resolve through a carrier-exposed socket and that the
# carrier synthesizes ONE node carrying all three maps.
# board is INJECTED by the test (carrier_analog_board), not declared
# here (rig.yml has no board: key; see reference/rig-file.rst).
rig:
  name: carrier_analog_passthrough
