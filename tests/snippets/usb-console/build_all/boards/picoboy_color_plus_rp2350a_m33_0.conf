# Zephyr chosen properties, disabled due to lack of board level support
CONFIG_TEST_CHOSEN_ZEPHYR_UART_MCUMGR=n
CONFIG_TEST_CHOSEN_ZEPHYR_BT_MON_UART=n
CONFIG_TEST_CHOSEN_ZEPHYR_BT_C2H_UART=n

# JSED @ PicoBoy Color Plus
CONFIG_TEST_EXPECTED_CDC_ACM_SERIAL_VID=0x2E8A
CONFIG_TEST_EXPECTED_CDC_ACM_SERIAL_PID=0x000A
CONFIG_TEST_EXPECTED_CDC_ACM_SERIAL_MANUFACTURER_STRING="JSED (Raspberry Pi)"
CONFIG_TEST_EXPECTED_CDC_ACM_SERIAL_PRODUCT_STRING="PicoBoy Color Plus (CDC ACM)"
CONFIG_TEST_EXPECTED_CDC_ACM_SERIAL_SELF_POWERED=n
CONFIG_TEST_EXPECTED_CDC_ACM_SERIAL_MAX_POWER=125
