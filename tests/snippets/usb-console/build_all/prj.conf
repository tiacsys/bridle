CONFIG_TEST=y
CONFIG_CONSOLE=y

# Zephyr chosen properties
CONFIG_TEST_CHOSEN_ZEPHYR_SHELL_UART=y
CONFIG_TEST_CHOSEN_ZEPHYR_UART_MCUMGR=y
CONFIG_TEST_CHOSEN_ZEPHYR_BT_MON_UART=y
CONFIG_TEST_CHOSEN_ZEPHYR_BT_C2H_UART=y

# USB Device Driver
CONFIG_TEST_EXPECTED_UDC_DRIVER=y
CONFIG_TEST_EXPECTED_UDC_DRIVER_LOG_LEVEL_ERR=y

# USB Device Stack
CONFIG_TEST_EXPECTED_USB_DEVICE_STACK_NEXT=y
CONFIG_TEST_EXPECTED_USBD_LOG_LEVEL_ERR=y

# USB CDC ACM Class
CONFIG_TEST_EXPECTED_USBD_CDC_ACM_CLASS=y
CONFIG_TEST_EXPECTED_USBD_CDC_ACM_LOG_LEVEL_OFF=y
CONFIG_TEST_EXPECTED_CDC_ACM_SERIAL_SELF_POWERED=n
CONFIG_TEST_EXPECTED_CDC_ACM_SERIAL_MAX_POWER=125

# Zephyr Project @ USB console sample
CONFIG_TEST_EXPECTED_CDC_ACM_SERIAL_VID=0x2FE3
CONFIG_TEST_EXPECTED_CDC_ACM_SERIAL_PID=0x0004
CONFIG_TEST_EXPECTED_CDC_ACM_SERIAL_MANUFACTURER_STRING="Zephyr Project"
CONFIG_TEST_EXPECTED_CDC_ACM_SERIAL_PRODUCT_STRING="Console over USB CDC ACM"
CONFIG_TEST_EXPECTED_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
